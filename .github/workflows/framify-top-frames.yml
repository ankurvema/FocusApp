name: Update Framify top frames

# Pulls per-frame usage from Google Analytics every Monday (the previous
# Sunday-Saturday week has fully ended by then) and commits
# framify/TopFrames.json, which the Framify app downloads. It can also be
# run by hand from the Actions tab; tick the option to re-fetch every period.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-fetch every week and month, not just the newest"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install google-analytics-data
      - name: Export top frames
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GA_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/ga-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/ga-key.json"
          if [ "${{ inputs.refresh }}" = "true" ]; then EXTRA="--refresh"; else EXTRA=""; fi
          python scripts/export_top_frames.py --out framify/TopFrames.json $EXTRA
          rm -f "$RUNNER_TEMP/ga-key.json"
      - name: Commit if changed
        run: |
          git config user.name "framify-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add framify/TopFrames.json
          git diff --cached --quiet || (git commit -m "Update Framify top frames" && git push)
